<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400"><defs><style>.bg{fill:#1e1e1e}.text{font-family:&apos;Consolas&apos;,&apos;Monaco&apos;,monospace;fill:#d4d4d4}.toolbar{fill:#252525}.active{fill:#00c851}</style></defs><rect width="1280" height="400" class="bg"/><rect width="1280" height="35" class="toolbar"/><text x="15" y="22" fill="#888" class="text" font-size="12">Active Flags</text><text x="140" y="22" fill="#666" class="text" font-size="12">Performance</text><text x="265" y="22" fill="#666" class="text" font-size="12">Impact Analysis</text><text x="430" y="22" fill="#666" class="text" font-size="12">Console</text><g><text x="0" y="20" fill="#4ec9b0" class="text" font-size="13" transform="translate(15, 50)">Flags Active on This Page:</text><g transform="translate(15, 50) translate(0, 40)"><circle cx="5" cy="5" r="4" class="active"/><text x="15" y="10" fill="#9cdcfe" class="text" font-size="12">privacy.resistFingerprinting</text><text x="350" y="10" fill="#888" class="text" font-size="11">= true</text><text x="450" y="10" fill="#ce9178" class="text" font-size="11">[Safe]</text></g><g transform="translate(15, 50) translate(0, 70)"><circle cx="5" cy="5" r="4" class="active"/><text x="15" y="10" fill="#9cdcfe" class="text" font-size="12">network.http.http3.enable</text><text x="350" y="10" fill="#888" class="text" font-size="11">= true</text><text x="450" y="10" fill="orange" class="text" font-size="11">[Experimental]</text></g><g transform="translate(15, 50) translate(0, 100)"><circle cx="5" cy="5" r="4" class="active"/><text x="15" y="10" fill="#9cdcfe" class="text" font-size="12">gfx.webrender.all</text><text x="350" y="10" fill="#888" class="text" font-size="11">= true</text><text x="450" y="10" fill="orange" class="text" font-size="11">[Experimental]</text></g><text x="0" y="160" fill="#4ec9b0" class="text" font-size="13" transform="translate(15, 50)">Observed Effects:</text><text x="15" y="185" class="text" font-size="11" transform="translate(15, 50)">• Canvas fingerprinting blocked (privacy.resistFingerprinting)</text><text x="15" y="205" class="text" font-size="11" transform="translate(15, 50)">• GPU acceleration active (gfx.webrender.all)</text><text x="15" y="225" class="text" font-size="11" transform="translate(15, 50)">• HTTP/3 connection established (network.http.http3.enable)</text><g transform="translate(15, 50) translate(0, 260)"><rect width="140" height="30" fill="#0e639c" rx="4"/><text x="70" y="20" class="text" font-size="12" text-anchor="middle">Start Recording</text><rect width="100" height="30" x="160" fill="none" stroke="#666" stroke-width="1" rx="4"/><text x="210" y="20" class="text" font-size="12" text-anchor="middle">Export Log</text></g></g></svg>