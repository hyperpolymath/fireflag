<svg xmlns="http://www.w3.org/2000/svg" width="400" height="600"><defs><style>.bg{fill:#fff}.text{font-family:system-ui,-apple-system,sans-serif;fill:#333}.header{fill:#0060df}.safe{fill:#00c851}.experimental{fill:#f80}.dangerous{fill:#f44}.card{fill:#f9f9fa;stroke:#d7d7db;stroke-width:1}</style></defs><rect width="400" height="600" class="bg"/><rect width="400" height="60" class="header"/><text x="20" y="35" fill="#fff" class="text" font-size="18" font-weight="bold">FireFlag</text><text x="20" y="52" fill="#fff" class="text" font-size="11" opacity=".9">Safe Firefox Flag Management</text><rect width="370" height="36" x="15" y="70" fill="#fff" stroke="#d7d7db" stroke-width="1" rx="4"/><text x="25" y="92" class="text" font-size="13" opacity=".6">Search flags...</text><rect width="80" height="28" x="15" y="116" fill="#0060df" rx="4"/><text x="32" y="135" fill="#fff" class="text" font-size="11">All (105)</text><rect width="60" height="28" x="105" y="116" fill="#fff" stroke="#d7d7db" stroke-width="1" rx="4"/><text x="115" y="135" class="text" font-size="11">Privacy</text><rect width="85" height="28" x="175" y="116" fill="#fff" stroke="#d7d7db" stroke-width="1" rx="4"/><text x="182" y="135" class="text" font-size="11">Performance</text><g transform="translate(15, 160)"><rect width="370" height="90" class="card" rx="6"/><rect width="50" height="18" x="8" y="8" class="safe" rx="3"/><text x="15" y="20" fill="#fff" font-size="9" font-weight="bold">SAFE</text><text x="8" y="38" class="text" font-size="13" font-weight="600">privacy.resistFingerprinting</text><text x="8" y="55" class="text" font-size="11" opacity=".7">Enable fingerprinting resistance to make</text><text x="8" y="70" class="text" font-size="11" opacity=".7">browser tracking harder</text><circle cx="350" cy="45" r="12" fill="#0060df"/><text x="346" y="50" fill="#fff" font-size="16">✓</text></g><g transform="translate(15, 260)"><rect width="370" height="90" class="card" rx="6"/><rect width="90" height="18" x="8" y="8" class="experimental" rx="3"/><text x="12" y="20" fill="#fff" font-size="9" font-weight="bold">EXPERIMENTAL</text><text x="8" y="38" class="text" font-size="13" font-weight="600">gfx.webrender.all</text><text x="8" y="55" class="text" font-size="11" opacity=".7">Force WebRender on all windows</text><text x="8" y="70" class="text" font-size="11" opacity=".7">(GPU-accelerated rendering)</text><circle cx="350" cy="45" r="12" fill="#d7d7db"/></g><g transform="translate(15, 360)"><rect width="370" height="90" class="card" rx="6"/><rect width="75" height="18" x="8" y="8" class="dangerous" rx="3"/><text x="12" y="20" fill="#fff" font-size="9" font-weight="bold">DANGEROUS</text><text x="8" y="38" class="text" font-size="13" font-weight="600">devtools.debugger.remote-enabled</text><text x="8" y="55" class="text" font-size="11" opacity=".7">Enable remote debugging protocol</text><text x="8" y="70" class="text" font-size="11" opacity=".7">⚠ Major security risk if exposed</text><circle cx="350" cy="45" r="12" fill="#d7d7db"/></g><g transform="translate(15, 460)"><rect width="370" height="90" class="card" rx="6"/><rect width="50" height="18" x="8" y="8" class="safe" rx="3"/><text x="15" y="20" fill="#fff" font-size="9" font-weight="bold">SAFE</text><text x="8" y="38" class="text" font-size="13" font-weight="600">network.http.http3.enable</text><text x="8" y="55" class="text" font-size="11" opacity=".7">Enable HTTP/3 protocol support</text><text x="8" y="70" class="text" font-size="11" opacity=".7">(QUIC transport)</text><circle cx="350" cy="45" r="12" fill="#0060df"/><text x="346" y="50" fill="#fff" font-size="16">✓</text></g><text x="200" y="585" class="text" font-size="10" opacity=".5" text-anchor="middle">105 flags loaded</text></svg>